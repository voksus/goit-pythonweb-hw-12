[project]
name = "goit-pythonweb-hw-012"
version = "0.1.0"
description = "REST API для контактної книги з JWT-автентифікацією, ролями, Redis-кешуванням та Sphinx"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.38",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "fastapi-mail>=1.4.1",
    "slowapi>=0.1.9",
    "cloudinary>=1.40.0",
    "redis[hiredis]>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
omit = [
    "tests/*",
    "migrations/*",
]
